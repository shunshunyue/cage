# 尚未配置框架发布地址时直接调用同一个 CLI 门禁。
# 框架发布后可将此任务替换为远端 app-verify.yml 的 uses 引用。
name: Cage application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: cage_ci }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CAGE_TEST_DATABASE_URL: postgres://postgres:cage_ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:app
      - run: pnpm cage verify
      - name: Pull request impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pnpm cage impact --base "$BASE_SHA" --format md --out .cage/impact.md
          cat .cage/impact.md >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cage-report
          include-hidden-files: true
          path: |
            .cage/verify.json
            .cage/test-results.json
            .cage/impact.md
