# 示例：Nginx 与 Cage API 在同一主机，API 监听 3000。
# 将 root 换成实际构建产物目录；容器部署时将 proxy_pass 换成 API 服务地址。
server {
    listen 80;
    server_name _;
    root /srv/cage/web;
    index index.html;

    # 单次请求只承载一个分片；流式转发避免代理先把完整分片落盘。
    location ~ ^/api/sys/uploads/[^/]+/parts/[0-9]+$ {
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 1800s;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 服务端拥有的入口保留原 URI；包含 /admin 的页面、脚本和样式。
    location ~ ^/(api|auth|hooks|admin)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
    }
    # 丢失的构建资源直接 404，防止浏览器把 index.html 当作 JS/CSS 解析。
    location ^~ /assets/ {
        try_files $uri =404;
    }
    # 业务详情深链接交给 React Router，刷新后仍能进入同一页面。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
