# 开发库和测试库使用不同 PostgreSQL 集群。testkit 会初始化集群角色，
# 因此不能把测试超级用户连接串指向持久化的开发库或生产库。
services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?先运行 pnpm db:setup 生成本地凭证}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${CAGE_POSTGRES_PORT:-54329}:5432'
    volumes:
      # PostgreSQL 18 官方镜像把数据目录放在此父目录的 18/docker 中。
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30

  postgres-test:
    image: postgres:18-bookworm
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: ${CAGE_TEST_POSTGRES_PASSWORD:?先运行 pnpm db:setup}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${CAGE_TEST_POSTGRES_PORT:-54330}:5432'
    # 测试数据可丢弃：停止并重新创建容器后，由测试环境重新建临时库。
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
